[project]
name = "prodml"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["scikit-learn","pandas","pyarrow","fastapi","uvicorn",
                "pydantic","pydantic-settings"]

[project.optional-dependencies]
dev = ["pytest","pytest-cov","ruff","black","mypy","httpx","pre-commit"]

[project.scripts]
prodml-train = "prodml.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.black]
target-version = ["py310"]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# E/F: errors and pyflakes, I: import order, UP: modern syntax, B: likely bugs
select = ["E", "F", "I", "UP", "B"]
